name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./android_app/gradlew

      - name: Build APK with Gradle
        working-directory: ./android_app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp ./android_app/app/build/outputs/apk/debug/app-debug.apk ./release-apk/ESP32-SmartNotif-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-SmartNotif-v1.0.6-APK
          path: ./release-apk/ESP32-SmartNotif-v1.0.6.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "ESP32 SmartNotif v1.0.6"
          body: |
            ### Pembaruan ESP32 SmartNotif v1.0.6
            - **Sinkronisasi Jam & Baterai HP [TIME]**: Mengirim waktu, tanggal, hari Indonesia, dan persentase baterai HP secara otomatis saat terhubung dan saat baterai berubah.
            - **Prakiraan Cuaca Open-Meteo [WEATHER]**: Menghubungkan GPS & Geocoder nama kota dengan Open-Meteo API secara berkala via WorkManager.
            - **Navigasi Google Maps [NAV]**: Menangkap notifikasi belokan dari Google Maps dan sinyal STOP saat selesai.
            - **Desain UI/UX Anti-Gravity**: Estetika warm sand (#EFECE6), panel off-white, tipografi deep espresso brown, dan kartu floating 3D.
          files: ./release-apk/ESP32-SmartNotif-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
