name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android App to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android_app
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Report Build Output to Job Summary
        if: always()
        run: |
          echo "### Gradle Build Log Output" >> $GITHUB_STEP_SUMMARY
          if [ -f "./android_app/build_output.log" ]; then
            echo "#### Compiler Diagnostics:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(e: |error: |FAILURE: |What went wrong:)" ./android_app/build_output.log | head -n 30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "#### Tail Log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ./android_app/build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No build output file found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp ./android_app/app/build/outputs/apk/debug/app-debug.apk ./release-apk/ESP32-SmartNotif-v1.0.7.apk

      - name: Upload APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-SmartNotif-v1.0.7-APK
          path: ./release-apk/ESP32-SmartNotif-v1.0.7.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: 'ESP32 SmartNotif v1.0.7'
          body: |
            ## Pembaruan ESP32 SmartNotif v1.0.7
            - Navbar Bawah Ramping WhatsApp-Style (56dp & Active Capsule Indicator)
            - Tombol Putuskan Koneksi Bluetooth di Halaman Setting
            - Ikon Aplikasi BMO Pixel Art Kustom
            - Navigasi Gestur Slide Switch Antar Menu (Swipe Kiri/Kanan)
            - Tema Antarmuka Baru: Putih & Hijau Pastel (White & Pastel Green)
          files: ./release-apk/ESP32-SmartNotif-v1.0.7.apk
        continue-on-error: true
