name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Inisialisasi Gradle Wrapper JAR
        working-directory: ./android_app
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android_app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-SmartNotif-App-Debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
