name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build:
    name: Compile Android App to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission untuk Gradlew
        run: |
          if [ -f android_app/gradlew ]; then
            chmod +x android_app/gradlew
          fi

      - name: Compile & Build Debug APK
        working-directory: ./android_app
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK ke Artifacts GitHub (Siap Download)
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-SmartNotif-App-Debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: (Opsional) Buat GitHub Release jika ada Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android_app/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
