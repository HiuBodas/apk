name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android App to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android_app
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Report Build Output to Job Summary
        if: always()
        run: |
          echo "### Gradle Build Log Output" >> $GITHUB_STEP_SUMMARY
          if [ -f "./android_app/build_output.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ./android_app/build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No build output file found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp ./android_app/app/build/outputs/apk/debug/app-debug.apk ./release-apk/ESP32-SmartNotif-v1.0.6.apk

      - name: Upload APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-SmartNotif-v1.0.6-APK
          path: ./release-apk/ESP32-SmartNotif-v1.0.6.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: 'ESP32 SmartNotif v1.0.6'
          body: |
            ## Pembaruan ESP32 SmartNotif v1.0.6
            - Jam & Baterai HP (TIME)
            - Cuaca Open-Meteo (WEATHER)
            - Navigasi Google Maps (NAV)
            - Tema Anti-Gravity Warm Sand & Deep Espresso
          files: ./release-apk/ESP32-SmartNotif-v1.0.6.apk
        continue-on-error: true
